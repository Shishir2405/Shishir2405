name: Profile README build

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 4 * * *"   # daily at 04:00 UTC
  workflow_dispatch:        # allow manual runs from the Actions tab

permissions:
  contents: write

concurrency:
  group: profile-readme
  cancel-in-progress: true

jobs:
  build:
    timeout-minutes: 120
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r cache/requirements.txt

      - name: Update SVG stats
        env:
          # Falls back to the built-in token / repo owner when the custom secrets are missing or empty
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN || secrets.GITHUB_TOKEN }}
          USER_NAME: ${{ secrets.USER_NAME || github.repository_owner }}
        run: python today.py

      - name: Commit changes
        run: |-
          git add dark_mode.svg light_mode.svg cache/
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git commit -m "Update profile stats" || echo "No changes to commit"
          git pull --rebase origin main || true
          git push
